name: Terraform Destroy

on:
  workflow_dispatch:

jobs:
  destroy:
    runs-on: ubuntu-latest

    env:
      TF_VAR_api_key: ${{ secrets.DD_API_KEY }}
      TF_VAR_app_key: ${{ secrets.DD_APP_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Terraform Destroy
        run: |
          terraform destroy -auto-approve \
            -var-file=tfvars/dashboard.tfvars \
            -var-file=tfvars/monitors.tfvars