name: Terraform Destroy

on:
  push:

jobs:
  destroy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - run: terraform init

      - run: terraform destroy -auto-approve \
          -var-file=tfvars/dashboard.tfvars \
          -var-file=tfvars/monitors.tfvars