name: Terraform Destroy

on:
  workflow_dispatch:

jobs:
  destroy:
    runs-on: ubuntu-latest

    env:
      TF_VAR_api_key: ${{ secrets.DD_API_KEY }}
      TF_VAR_app_key: ${{ secrets.DD_APP_KEY }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Plan
        run: |
          terraform plan \
            -var-file=tfvars/dashboard.tfvars \
            -var-file=tfvars/monitors.tfvars

      - name: Terraform Destroy
        run: |
          terraform destroy -auto-approve \
            -var-file=tfvars/dashboard.tfvars \
            -var-file=tfvars/monitors.tfvars